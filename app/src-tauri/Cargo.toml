[package]
name = "salonera"
version = "0.1.1"
description = "Salonera - Düğün salonu yönetimi"
authors = ["Salonera"]
edition = "2021"

[lib]
name = "salonera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
salonera-core = { path = "../core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
