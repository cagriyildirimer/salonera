[package]
name = "salonera-core"
edition.workspace = true
version.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.22"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "native-tls", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
